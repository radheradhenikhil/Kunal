        /* Chat scrollbar */

        #chat-window::-webkit-scrollbar-thumb {

        }

        /* Typing indicator */
        .dot-flashing {
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dotFlashing 1s infinite linear alternate;
            animation-delay: .5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dotFlashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dotFlashing {
            0% { background-color: var(--accent); }
            50%, 100% { background-color: rgba(var(--accent), 0.2); }
        }

                systemPrompt: "You are Vivek Joshi — India's most electrifying motivational speaker and life coach. You've spoken to millions, made people quit dead-end jobs, start businesses, come back from rock bottom. You failed twice, went bankrupt once, and rebuilt everything from scratch. PHILOSOPHY: 'Zindagi mein failure nahi aata toh growth bhi nahi aata.' Every person has an extraordinary life within them, buried under fear and comfort. Action is everything — motivation without action is just entertainment. You mix ancient Indian wisdom (Bhagavad Gita, Chanakya, Kabir) with modern neuroscience and psychology. EXPERTISE: Overcoming procrastination with specific behavioral techniques; Goal Setting (SMART goals, vision boards, reverse planning from death to today); Identity-based habit change; Dealing with fear of failure, rejection, judgment; Self-discipline, consistency, resilience; Finding Ikigai (purpose); Morning routines; Entrepreneurship mindset. PERSONALITY: Like a fierce storm — intense, passionate, unapologetically direct. You do NOT coddle: 'Yaar, jo tum excuses de rahe ho, woh tumhari life bana rahi hai ya tabah kar rahi hai?' But the fire comes from LOVE — you challenge because you believe fiercely in them. Use powerful stories, metaphors, real-world examples. Short punchy sentences that hit hard. RESPONSE FORMAT: Open with a powerful statement or story — grab attention immediately. Build emotional intensity, then pivot to a specific actionable framework. Give CONCRETE next steps: 'Aaj raat 10 baje, phone band karo aur yeh 3 kaam karo...' End with a challenge: 'Ab batao — kal subah 6 baje uthoge kya? Haan ya nahi?' LANGUAGE RULE: Passionate Hinglish. Match user's language if needed."
            },
            fashion: {
                id: 'fashion',
                name: "Riya Kapoor (Style Icon)",
                title: "Fashion Designer",
                icon: "💃",
                theme: "theme-fashion",
                systemPrompt: "You are Riya Kapoor — a celebrated fashion designer from Delhi, trained at NIFT, with stints at fashion weeks in Milan, Paris, and Lakme Fashion Week. You run your own luxury pret label and a styling consultancy. Fashion is not about following trends — it's about understanding yourself and telling your story through what you wear. EXPERTISE: Personal Styling (body types — apple, pear, hourglass, rectangle, inverted triangle — and what works best); Indian Fashion (sarees — draping styles, fabrics, occasions; Lehengas, Anarkalis, Kurtas, Sherwanis, Fusion); Western Fashion (Casual, Business casual, Formal, Party looks); Color Theory (skin tone — fair, wheatish, dusky, deep — and flattering colors); Capsule Wardrobe building (30 pieces creating 100 outfits); Budget Fashion (looking expensive on a tight budget — where to shop in India); Occasion dressing (office, wedding, dates, festivals); Accessories (bags, shoes, jewelry, watches transforming outfits); Sustainable & slow fashion. PERSONALITY: Chic, direct, passionately opinionated. Encouraging, NEVER body-shaming. 'Darling, fashion rules are made to be broken — but learn them first.' You call out fast fashion traps and suggest better alternatives. Genuinely excited: 'Yaar, yeh combination toh kamaal ka rahega!' RESPONSE FORMAT: Ask about occasion, body type, budget, and existing wardrobe before recommending. Give specific suggestions with actual garment types, colors, Indian shops (Zara, Myntra, Fabindia, Sarojini, local tailors). Build outfits step by step: Top → Bottom → Footwear → Accessories → Hair/Makeup hint. Include a 'what to AVOID' section. For Indian occasions: Suggest 3 options at budget/mid/splurge levels. LANGUAGE RULE: Stylish Hinglish primarily, adapt to user's language."
            },
            architect: {
                id: 'architect',
                name: "Kabir Anand (Design Partner)",
                title: "Architect & Interior Designer",
                icon: "🏛️",
                theme: "theme-architect",
                systemPrompt: "You are Kabir Anand — an award-winning Architect and Interior Designer with 20 years of practice. IIT Kharagpur graduate, founder of a design firm known for blending contemporary minimalism with India's rich vernacular architecture tradition. You've designed everything from 400 sq ft Mumbai studios to sprawling Jaipur haveli restorations. EXPERTISE: Architecture (space planning, floor layouts, building typologies, structural basics, vastu); Interior Design (Residential, Commercial, Hospitality); Design Styles (Minimalist, Modern, Contemporary, Industrial, Japandi, Bohemian, Traditional Indian — Rajasthani, Kerala, Mughal-inspired); Materials (concrete, wood, marble/stone, tiles, glass, metals, paints — sheen, finish, Indian brands); Lighting Design (natural light optimization, layered artificial lighting — ambient, task, accent); Color schemes and psychology of color in interiors; Small space optimization (Indian city apartments, jugaad solutions); Budget management for renovations; Sustainable and biophilic design; Working with contractors and avoiding common renovation scams in India. PERSONALITY: Thoughtful, precise, deeply visual in language: 'Socho toh — agar sunlight subah 8 baje east window se aaye toh kitchen mein golden hour jaisa hoga.' You see beauty in function and function in beauty. Patient but opinionated. Proactively points out design mistakes people commonly make (wrong-scale furniture, bad lighting, clutter). RESPONSE FORMAT: Always ask about the space (dimensions, climate zone, existing elements, budget, occupants) before recommending. Give a clear design concept/mood first, then specific elements. Suggest specific Indian brands/vendors (Asian Paints, Kajaria, Duravit, local fabricators). For renovation: give realistic budget breakdown and timeline. Describe spatial concepts visually to help users 'see' the space in their mind. LANGUAGE RULE: Thoughtful English primarily, Hinglish warmly accepted, match user's preference."
            }
        };

        // --- 2. STATE VARIABLES ---
        let currentAvatarId = 'general'; // Default avatar
        let chatHistory = [];
        let isWaitingForResponse = false;
        
        // --- 3. DOM ELEMENTS ---
        const appElement = document.getElementById('app');
        const clearChatButton = document.getElementById('clear-chat-button');
        
        const avatarList = document.getElementById('avatar-list');
        const avatarIcon = document.getElementById('avatar-icon');
        const avatarName = document.getElementById('avatar-name');
        const avatarTitle = document.getElementById('avatar-title');
        
        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');

        // --- 4. API & CHAT FUNCTIONS ---

        /**
         * Direct AI API Call (Jugaad Method using OpenRouter)
         */
        async function callAIAPI(userMessage) {
            if (isWaitingForResponse) return;
            
            if (!API_KEY || API_KEY === "YOUR_API_KEY_HERE") {
                displayMessage('model', "Bhai, pehle line 294 par apni API key daalo code mein! 😅");
                return;
            }

            isWaitingForResponse = true;
            typingIndicator.style.display = 'block';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const maxRetries = 3;
            let delay = 1000; // 1 second
            
            // 1. Add user message to history (Standard OpenAI format)
            chatHistory.push({
                role: "user",
                content: userMessage
            });

            // 2. Get current avatar's system prompt
            const systemPrompt = avatars[currentAvatarId].systemPrompt;
            
            // 3. Prepare messages for standard OpenAI-compatible APIs (OpenRouter, Groq, etc)
            const apiMessages = [
                { role: "system", content: systemPrompt },
                ...chatHistory
            ];
            
            // 4. Using OpenRouter as Jugaad (access to multiple free models)
            // const apiUrl = 'https://openrouter.ai/api/v1/chat/completions';
            // Agar Groq use karna ho toh isko uncomment karna aur upar wala comment kar dena:
            const apiUrl = 'https://api.groq.com/openai/v1/chat/completions';

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`,
                            // OpenRouter headers
                            'HTTP-Referer': window.location.href, 
                            'X-Title': 'ProAvatar AI' 
                        },
                        body: JSON.stringify({ 
                            // OpenRouter free model:
                            // model: "meta-llama/llama-3.1-8b-instruct:free", 
                            // Agar Groq API use kar rahe ho toh ye model likhna:
                            model: "llama-3.1-8b-instant",
                            messages: apiMessages
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`API Error ${response.status}: ${errorData.error?.message || JSON.stringify(errorData)}`);
                    }

                    const result = await response.json();

                    if (result.choices && result.choices.length > 0) {
                        const modelResponse = result.choices[0].message.content;
                        
                        // Add model response to history
                        chatHistory.push({
                            role: "assistant",
                            content: modelResponse
                        });

                        displayMessage('model', modelResponse);
                    } else {
                        displayMessage('model', "I'm sorry, I received an empty response. Please try again.");
                    }
                    
                    // Success, exit retry loop
                    isWaitingForResponse = false;
                    typingIndicator.style.display = 'none';
                    return;

                } catch (error) {
                    console.error('Fetch error:', error);
                    if (i === maxRetries - 1) {
                        // Last retry failed
                        displayMessage('model', `Network error aa gaya bhai. Error: ${error.message}`);
                        // Remove the user message that failed to send
                        chatHistory.pop();
                    } else {
                        // Wait before retrying
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2; // Exponential backoff
                    }
                }
            }
            
            isWaitingForResponse = false;
            typingIndicator.style.display = 'none';
        }

        /**
         * Handles sending a message from the user input.
         */
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && !isWaitingForResponse) {
                displayMessage('user', message);
                callAIAPI(message);
                messageInput.value = '';
            }
        }

        // --- 5. UI & THEME FUNCTIONS ---

        /**
         * Improved markdown-to-HTML parser.
         */
        function parseMarkdown(text) {
            let sanitizedText = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Process markdown blocks
            let html = sanitizedText
                // Code blocks (must be first)
                .replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    const safeCode = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    return `\n<pre class="bg-gray-900 text-white p-4 rounded-md my-2 overflow-x-auto"><code class="language-${lang || ''}">${safeCode}</code></pre>\n`;
                })
                // Headings (must be at start of line)
                .replace(/^### (.*$)/gim, '<h3 class="text-lg font-semibold mt-2">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold mt-3">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold mt-4">$1</h1>')
                // Blockquotes
                .replace(/^> (.*$)/gim, '<blockquote class="border-l-4 pl-4 italic my-2" style="border-color: var(--accent);">$1</blockquote>')
                // Unordered lists
                .replace(/^\s*[\*-] (.*$)/gim, '<li class="list-disc list-inside ml-4">$1</li>')
                // Ordered lists
                .replace(/^\s*\d+\. (.*$)/gim, '<li class="list-decimal list-inside ml-4">$1</li>')
                // Bold
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // Newlines to <br> (only if not followed by a block)
                .replace(/\n(?!<(h[1-3]|li|pre|blockquote))/g, '<br>')
                // Clean up extra breaks
                .replace(/<br><li/g, '<li')
                .replace(/<\/pre><br>/g, '</pre>');

            return html;
        }

        /**
         * Appends a message to the chat window.
         */
        function displayMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('flex', 'max-w-xl', 'md:max-w-2xl', 'mx-2');
            
            const processedMessage = parseMarkdown(message);

            if (sender === 'user') {
                messageElement.classList.add('justify-end', 'ml-auto');
                const lightThemes = ['doctor', 'teacher', 'financial', 'general', 'therapist', 'fashion', 'architect'];
                const userTextColor = lightThemes.includes(currentAvatarId) ? '#1f2937' : 'white';
                
                messageElement.innerHTML = `
                    <div class="p-3 rounded-xl rounded-br-none" style="background-color: var(--user-bubble); color: ${userTextColor};">
                        <p class="text-sm md:text-base">${processedMessage}</p>
                    </div>
                `;
            } else { // 'model' or 'system'
                messageElement.classList.add('justify-start', 'mr-auto');
                messageElement.innerHTML = `
                    <div class="p-3 rounded-xl rounded-bl-none" style="background-color: var(--bg-tertiary);">
                        <p class="text-sm md:text-base" style="color: var(--text-primary);">${processedMessage}</p>
                    </div>
                `;
            }
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * Changes the entire UI theme and chat header.
         */
        function selectAvatar(avatarId) {
            if (!avatars[avatarId]) return;

            currentAvatarId = avatarId;
            const avatar = avatars[avatarId];

            // 1. Update theme
            document.body.className = avatar.theme;

            // 2. Update header
            avatarIcon.textContent = avatar.icon;
            avatarName.textContent = avatar.name;
            avatarTitle.textContent = avatar.title;

            // 3. Clear chat
            chatWindow.innerHTML = '';
            chatHistory = [];

            // 4. Update active button style
            document.querySelectorAll('#avatar-list button').forEach(btn => {
                if (btn.dataset.id === avatarId) {
                    btn.style.backgroundColor = 'var(--accent)';
                    btn.style.color = 'white';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                }
            });

            // 5. Display welcome message
            displayMessage('model', `Namaste! I'm ${avatar.name}, your ${avatar.title}. How can I help you today?`);
        }

        /**
         * Populates the sidebar with avatar selection buttons.
         */
        function populateAvatarList() {
            avatarList.innerHTML = '';
            for (const key in avatars) {
                const avatar = avatars[key];
                const button = document.createElement('button');
                button.dataset.id = avatar.id;
                button.className = 'w-full flex items-center p-3 rounded-lg text-sm transition duration-200 hover:bg-[var(--bg-tertiary)]';
                button.innerHTML = `
                    <span class="text-2xl mr-3">${avatar.icon}</span>
                    <span class="hidden md:block font-medium">${avatar.name}</span>
                `;
                button.addEventListener('click', () => selectAvatar(avatar.id));
                avatarList.appendChild(button);
            }
        }

        // --- 6. EVENT LISTENERS & INITIALIZATION ---

        /**
         * Handles API Key logic and app initialization.
         */
        function initializeApp() {
            // No API key modal needed!
            appElement.classList.remove('hidden');
            
            // Populate avatars and set default
            populateAvatarList();
            selectAvatar(currentAvatarId);

            // Clear Chat Listener
            clearChatButton.addEventListener('click', () => {
                // Using a custom confirm because window.confirm() might be blocked
                if (confirm('Are you sure you want to clear this conversation?')) {
                    chatWindow.innerHTML = '';
                    chatHistory = [];
                    const avatar = avatars[currentAvatarId];
                    displayMessage('model', `Namaste! I'm ${avatar.name}, your ${avatar.title}. How can I help you today?`);
                }
            });

            // Chat Input Listeners
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); // Prevent newline
                    sendMessage();
                }
            });
        }
        
        // Start the application on load
        document.addEventListener('DOMContentLoaded', initializeApp);

    </script>
